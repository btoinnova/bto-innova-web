<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Comparar BTo Digital A, B y C</title>
<style>
:root{--bg:#f4f1ea;--ink:#121212;--line:#121212;--on:#ff3b1d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#f4f1ea;--line:#f4f1ea}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
header{padding:14px 16px;border-bottom:2px solid var(--line)}
h1{margin:0;font-size:18px}
p{margin:4px 0 0;font-size:13px;opacity:.75}
nav{display:flex;gap:8px;padding:12px 16px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
nav button{flex:1;min-height:44px;font:700 14px system-ui;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--on);color:#121212}
.cols{display:flex;gap:16px;padding:16px;justify-content:center}
.col{display:none;flex:0 0 390px}
.col.on{display:block}
.col h2{margin:0 0 8px;font-size:14px}
.col a{font-size:13px;color:inherit}
iframe{width:100%;height:78vh;border:2px solid var(--line);border-radius:12px;background:#fff}
@media (min-width:1240px){nav{display:none}.col{display:block}}
@media (max-width:420px){.col{flex-basis:100%}.cols{padding:12px}}
</style>
</head>
<body>
<header><h1>BTo Digital: tres direcciones</h1><p>Cada página funciona dentro de su marco: desliza, toca y prueba las interacciones. En celular, elige con los botones; en pantalla ancha se ven las tres a la vez.</p></header>
<nav aria-label="Elegir dirección">
<button data-t="a" aria-pressed="true">A · Cartel</button>
<button data-t="b" aria-pressed="false">B · Neón</button>
<button data-t="c" aria-pressed="false">C · Suizo</button>
</nav>
<div class="cols">
<section class="col on" id="a"><h2>A · Cartel de Esquina</h2><iframe title="Dirección A" src="../digital-v3-a/" loading="lazy"></iframe><a href="../digital-v3-a/">Abrir sola</a></section>
<section class="col" id="b"><h2>B · Neón Nocturno</h2><iframe title="Dirección B" src="../digital-v3-b/" loading="lazy"></iframe><a href="../digital-v3-b/">Abrir sola</a></section>
<section class="col" id="c"><h2>C · Taller Suizo</h2><iframe title="Dirección C" src="../digital-v3-c/" loading="lazy"></iframe><a href="../digital-v3-c/">Abrir sola</a></section>
</div>
<script>
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){
document.querySelectorAll('nav button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
document.querySelectorAll('.col').forEach(function(c){c.classList.toggle('on',c.id===b.dataset.t)});
});});
</script>
</body>
</html>
